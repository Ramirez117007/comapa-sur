<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis archivos - COMAPA Sur</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>">
</head>

<body>
    <header class="header-archivos">
        <div class="container">
            <h2 id="tituloArea">Cargando...</h2>
            <button id="btnSalir">Cerrar sesión</button>
        </div>
    </header>

    <main class="contenedor-archivos">
        <div class="barra-herramientas">
    <input type="search" id="buscador" class="buscador"
           placeholder="Buscar archivo..." aria-label="Buscar archivo">
    <div id="pestanas" class="filtro-carpeta" style="display:none;"></div>
    </div>
        <div id="listaArchivos" class="grid-archivos">
            <!-- Aquí el JavaScript va a insertar las tarjetas de archivos -->
        </div>
        <p id="sinArchivos" class="sin-archivos" style="display:none;">
            No hay archivos disponibles en esta área.
        </p>
    </main>

    <div id="modalArchivo" class="modal-overlay" style="display:none;">
        <div class="modal-contenido">
            <button id="btnCerrarModal" class="btn-cerrar-modal">&times;</button>
            <h3 id="modalNombreArchivo"></h3>
            <span id="modalTipoArchivo" class="tipo-archivo"></span>
            <div id="modalVistaPrevia" class="modal-vista-previa"></div>
        </div>
    </div>

    <script src="funciones.js"></script>
</body>

</html>
